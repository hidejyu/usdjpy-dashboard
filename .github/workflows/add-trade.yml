name: Add Trade From Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-trade:
    if: contains(github.event.issue.labels.*.name, 'trade')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue and append trade
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';

            function escapeRegExp(s) {
              return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }
            function field(label) {
              const re = new RegExp('### ' + escapeRegExp(label) + '\\s*\\n\\n([\\s\\S]*?)(\\n### |$)');
              const m = body.match(re);
              if (!m) return '';
              const v = m[1].trim();
              return (v === '_No response_' || v === 'None') ? '' : v;
            }

            const directionJa = field('方向');
            const direction = directionJa === '買い' ? 'buy' : 'sell';
            const entryTime = field('約定日時(日本時間)');
            const entryPriceRaw = field('約定価格');
            const exitTime = field('決済日時(日本時間・未決済なら空欄)');
            const exitPriceRaw = field('決済価格(未決済なら空欄)');
            const qtyRaw = field('数量(USD建て・任意。入力すると円損益も計算)');

            const entryPrice = parseFloat(entryPriceRaw);
            if (!entryTime || isNaN(entryPrice)) {
              core.setFailed('Required fields missing or invalid: entry_time=' + entryTime + ' entry_price=' + entryPriceRaw);
              return;
            }

            const trade = {
              direction: direction,
              entry_time: entryTime,
              entry_price: entryPrice,
              exit_time: exitTime || null,
              exit_price: exitTime && exitPriceRaw ? parseFloat(exitPriceRaw) : null,
              qty: qtyRaw ? parseFloat(qtyRaw) : null
            };

            let trades = [];
            try {
              trades = JSON.parse(fs.readFileSync('trades.json', 'utf8'));
            } catch (e) {}
            trades.push(trade);
            fs.writeFileSync('trades.json', JSON.stringify(trades, null, 2) + '\n');

            core.setOutput('summary', `${directionJa} ${entryTime} @ ${entryPrice}`);

      - name: Commit trades.json
        run: |
          git config user.name "trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trades.json
          git commit -m "Add trade via issue #${{ github.event.issue.number }}"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate dashboard
        run: python update.py

      - name: Commit dashboard
        run: |
          git add index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Regenerate dashboard after new trade"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '取引を追加し、ダッシュボードを更新しました。 https://hidejyu.github.io/usdjpy-dashboard/'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
