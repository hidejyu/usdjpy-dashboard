name: Add Trade From Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-trade:
    if: contains(github.event.issue.labels.*.name, 'trade')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue and append trade
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || '';

            function escapeRegExp(s) {
              return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }
            function field(label) {
              const re = new RegExp('### ' + escapeRegExp(label) + '\\s*\\n\\n([\\s\\S]*?)(\\n### |$)');
              const m = body.match(re);
              if (!m) return '';
              const v = m[1].trim();
              return (v === '_No response_' || v === 'None') ? '' : v;
            }

            const directionJa = field('方向');
            const direction = directionJa === '買い' ? 'buy' : 'sell';
            const lot = parseFloat(field('Lot数(1lot=100,000通貨)'));
            const entryDate = field('約定日(日本時間)');
            const entryHour = field('約定時刻(時・24時間表記)');
            const entryMinute = field('約定時刻(分)');
            const entryPriceRaw = field('約定価格');
            const closedJa = field('決済状況');
            const isClosed = closedJa === '決済済み';
            const exitDate = field('決済日(日本時間・未決済なら空欄)');
            const exitHour = field('決済時刻(時・未決済なら選択不要)');
            const exitMinute = field('決済時刻(分・未決済なら選択不要)');
            const exitPriceRaw = field('決済価格(未決済なら空欄)');

            const entryPrice = parseFloat(entryPriceRaw);
            if (!entryDate || !entryHour || !entryMinute || isNaN(entryPrice) || isNaN(lot)) {
              core.setFailed('Required fields missing or invalid: entryDate=' + entryDate + ' entryHour=' + entryHour + ' entryMinute=' + entryMinute + ' entryPrice=' + entryPriceRaw + ' lot=' + lot);
              return;
            }
            const entryTime = `${entryDate} ${entryHour}:${entryMinute}`;
            const exitTime = (isClosed && exitDate && exitHour && exitMinute) ? `${exitDate} ${exitHour}:${exitMinute}` : null;
            const exitPrice = (isClosed && exitPriceRaw) ? parseFloat(exitPriceRaw) : null;

            const trade = {
              direction: direction,
              entry_time: entryTime,
              entry_price: entryPrice,
              exit_time: exitTime,
              exit_price: exitPrice,
              qty: Math.round(lot * 100000),
              lot: lot
            };

            let trades = [];
            try {
              trades = JSON.parse(fs.readFileSync('trades.json', 'utf8'));
            } catch (e) {}
            trades.push(trade);
            fs.writeFileSync('trades.json', JSON.stringify(trades, null, 2) + '\n');

            core.setOutput('summary', `${directionJa} ${entryTime} @ ${entryPrice}`);

      - name: Commit trades.json
        run: |
          git config user.name "trade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trades.json
          git commit -m "Add trade via issue #${{ github.event.issue.number }}"
          git push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate dashboard
        run: python update.py

      - name: Commit dashboard
        run: |
          git add index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Regenerate dashboard after new trade"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '取引を追加し、ダッシュボードを更新しました。 https://hidejyu.github.io/usdjpy-dashboard/'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
