name: Update USD/JPY Dashboard

on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: python update.py

      - name: Commit and push if changed
        run: |
          git config user.name "usdjpy-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
